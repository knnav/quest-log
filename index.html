<title>Quest Log</title>
<link rel="stylesheet" href="assets/css/styles.css">

<div class="titlebar">
  <span class="titlebar-title">QUEST LOG</span>
  <div class="titlebar-controls">
    <button class="titlebar-btn" id="minimizeBtn" title="Minimize">─</button>
    <button class="titlebar-btn close" id="closeBtn" title="Close">✕</button>
  </div>
</div>

<header class="chrome">
  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab tab-home" data-tab="home" role="tab" aria-selected="true" title="Home">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2.5c2.6 3.4 1 5.4.2 6.3-1 1.1-1.7 2-1.7 3.2a2.8 2.8 0 0 0 5.6 0c0-.7-.2-1.3-.5-1.9 2.2 1.4 3.4 3.5 3.4 6A7 7 0 0 1 5 16.1C5 11 9.6 9.4 12 2.5z"/>
      </svg>
      <span class="sr-only">Home</span>
    </button>
    <button class="tab" data-tab="quests" role="tab" aria-selected="false">Quests</button>
    <button class="tab" data-tab="tasks" role="tab" aria-selected="false">Tasks</button>
  </nav>
  <div class="chrome-actions">
    <button class="btn primary" id="addQuestBtn" title="Create a quest (Ctrl+N)">+ Quest</button>
    <button class="btn primary" id="addTaskBtn" title="Create a task (Ctrl+Shift+N)" hidden>+ Task</button>
    <div class="theme-picker">
      <button class="btn icon-only" id="themeMenuBtn" title="Theme" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.4 2.6a2 2 0 0 1 2.8 2.8l-8 8-3.6.8.8-3.6 8-8z"/>
          <path d="M6 14c-1.7 0-3 1.3-3 3 0 1.3-.5 2-1 2.5 1 .8 2.3 1.5 4 1.5 2.2 0 4-1.8 4-4 0-1.7-1.3-3-3-3z"/>
        </svg>
      </button>
      <div class="theme-menu" id="themeMenu" hidden></div>
    </div>
  </div>
</header>

<main class="app-scroll">
<div class="wrap">

  <section class="screen home" id="homeScreen">
    <div class="home-stats">
      <div class="stat-col">
        <h2 class="stat-col-title">Quests</h2>
        <div id="questStats"></div>
      </div>
      <div class="stat-col">
        <h2 class="stat-col-title">Tasks</h2>
        <div id="taskStats"></div>
      </div>
    </div>

    <div class="hearth">
      <!-- Painted back to front: halo, ash bed, the back log, two crossed logs,
           the coals burning between them, then the flame from outer to hottest. -->
      <div class="bonfire" id="bonfire" data-stage="0" aria-hidden="true">
        <span class="fire-glow"></span>
        <span class="fire-ash"></span>
        <span class="fire-log log-back"></span>
        <span class="fire-log log-l"></span>
        <span class="fire-log log-r"></span>
        <span class="fire-coals"></span>
        <span class="fire-flame flame-a"></span>
        <span class="fire-flame flame-b"></span>
        <span class="fire-flame flame-c"></span>
        <span class="fire-core"></span>
      </div>
      <p class="hearth-stage" id="bonfireStage">Embers</p>
      <p class="hearth-note" id="bonfireNote"></p>
    </div>

    <!-- Pinned to the bottom of the screen; the hearth above takes whatever
         height is left, so the fire grows into the space instead of floating. -->
    <div class="home-foot">
      <div class="since">
        <div class="since-value" id="sinceValue">—</div>
        <div class="since-label" id="sinceLabel">nothing finished yet</div>
        <div class="clock" id="clock">--:--</div>
      </div>

      <p class="motd" id="motd"></p>
    </div>
  </section>

  <section class="screen" id="questsScreen" hidden>
    <!-- Above everything it filters, rather than stranded mid-page looking
         like it only applies to whichever block it happens to sit next to. -->
    <div class="filters" id="filters"></div>

    <section class="tier" id="questsInProgress" hidden>
      <div class="tier-head"><h2 class="tier-title">In Progress</h2></div>
      <div class="grid" id="progressGrid"></div>
    </section>

    <div id="board">
      <div class="loading">loading quest log…</div>
    </div>
  </section>

  <section class="screen" id="tasksScreen" hidden>
    <section class="tier" id="progressTasks" hidden>
      <div class="tier-head"><h2 class="tier-title">In Progress</h2></div>
      <div class="grid" id="progressTasksGrid"></div>
    </section>

    <section class="tier" id="backlogTasks" hidden>
      <div class="tier-head"><h2 class="tier-title">Backlog</h2></div>
      <div class="grid" id="backlogTasksGrid"></div>
    </section>

    <section class="tier" id="tasksHallOfFame" hidden>
      <div class="tier-head"><h2 class="tier-title">Hall of Fame</h2></div>
      <div class="grid" id="tasksHallOfFameGrid"></div>
    </section>

    <div class="empty-state" id="tasksEmpty" hidden>No tasks yet.</div>
  </section>

</div>
</main>

<div class="modal-overlay" id="detailModalOverlay" hidden>
  <div class="modal">
    <h2 id="detailTitle"></h2>
    <div class="tags" id="detailTags" hidden></div>
    <p class="detail-text" id="detailText" hidden></p>
    <div class="detail-rows" id="detailRows"></div>
    <div class="modal-actions detail-actions">
      <button type="button" class="btn danger" id="detailDeleteBtn">Delete</button>
      <span class="modal-actions-gap"></span>
      <button type="button" class="btn" id="detailCloseBtn">Close</button>
      <button type="button" class="btn primary" id="detailEditBtn">Edit</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="questModalOverlay" hidden>
  <div class="modal">
    <h2 id="questModalTitle">Add Quest</h2>
    <form id="questForm">
      <div class="field">
        <label for="questTitle">Title</label>
        <input id="questTitle" required>
      </div>
      <div class="field">
        <label for="questHook">Hook</label>
        <textarea id="questHook" required></textarea>
      </div>
      <div class="field">
        <label for="questTier">Scope</label>
        <!-- The one place the durations earn their space: this is where you
             commit to a size, so the headings don't have to repeat it. -->
        <select id="questTier">
          <option value="weekend">Weekend — 1–3 days</option>
          <option value="medium">Fortnight — 1–2 weeks</option>
          <option value="ongoing">Ongoing — recurring</option>
        </select>
      </div>
      <div class="field">
        <label for="questTags">Tags (comma-separated)</label>
        <input id="questTags">
      </div>
      <div class="field">
        <label for="questDod">Done when</label>
        <textarea id="questDod" required></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="questCancelBtn">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="taskModalOverlay" hidden>
  <div class="modal">
    <h2 id="taskModalTitle">Create Task</h2>
    <form id="taskForm">
      <div class="field">
        <label for="taskTitle">Title</label>
        <input id="taskTitle" required>
      </div>
      <div class="field">
        <label for="taskNote">Note</label>
        <textarea id="taskNote"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="taskCancelBtn">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="js/app.js"></script>
