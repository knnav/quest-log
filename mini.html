<title>Session</title>
<link rel="stylesheet" href="assets/css/styles.css">

<div class="mini">
  <div class="mini-body">
    <p class="mini-quest" id="miniQuest"></p>
    <p class="mini-clock" id="miniClock">--:--</p>
  </div>
  <div class="mini-actions">
    <button class="mini-btn" id="miniToggle" title="Pause">II</button>
    <button class="mini-btn stop" id="miniStop" title="Stop session">&#9632;</button>
  </div>
  <div class="mini-progress"><span id="miniBar"></span></div>
</div>

<script type="module" src="js/mini.js"></script>
